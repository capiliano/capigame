<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>CAPILIANO - Jungle Run</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #06130a;
    font-family: Arial, Helvetica, sans-serif;
    touch-action: none;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
}

/* =========================
   PANTALLA DE INICIO
========================= */

#startScreen {

    position: fixed;
    inset: 0;

    z-index: 20;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;

    background:
        linear-gradient(
            rgba(5,30,14,.20),
            rgba(2,12,7,.82)
        );

    pointer-events: auto;
}

.title {

    font-size:
        clamp(48px, 12vw, 100px);

    font-weight: 1000;

    letter-spacing: 5px;

    color: #f1d16a;

    text-shadow:
        0 5px 0 #654b17,
        0 12px 35px rgba(0,0,0,.8);

}

.subtitle {

    margin-top: 5px;

    font-size:
        clamp(12px, 3vw, 20px);

    letter-spacing: 6px;

    color: white;

    opacity: .9;

}

.startCapy {

    font-size:
        clamp(75px, 22vw, 150px);

    margin: 25px 0;

    animation:
        capyIdle 1.4s
        ease-in-out infinite;

}

@keyframes capyIdle {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-13px);
    }

}

.tapText {

    font-size:
        clamp(17px, 4vw, 27px);

    font-weight: 900;

    letter-spacing: 4px;

    color: white;

    animation:
        blink 1.2s infinite;

}

@keyframes blink {

    0%,100% {
        opacity: 1;
    }

    50% {
        opacity: .45;
    }

}


/* =========================
   HUD
========================= */

#hud {

    position: fixed;

    top: 15px;
    left: 15px;
    right: 15px;

    z-index: 10;

    display: none;

    justify-content:
        space-between;

    pointer-events: none;

}

.hudBox {

    padding:
        9px 15px;

    border-radius:
        30px;

    background:
        rgba(0,0,0,.42);

    border:
        1px solid
        rgba(255,255,255,.18);

    color: white;

    font-size: 15px;

    font-weight: 800;

    backdrop-filter:
        blur(8px);

}


/* =========================
   GAME OVER
========================= */

#gameOver {

    position: fixed;

    inset: 0;

    z-index: 30;

    display: none;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    background:
        rgba(0,0,0,.72);

    color: white;

}

#gameOver h1 {

    font-size:
        clamp(34px, 8vw, 70px);

    margin-bottom: 15px;

}

#gameOver p {

    line-height: 1.8;

    font-size: 19px;

}

#restartText {

    margin-top: 30px;

    font-weight: 900;

    font-size: 18px;

    letter-spacing: 2px;

    animation:
        blink 1.2s infinite;

}

</style>
</head>


<body>


<canvas id="game"></canvas>


<!-- =========================
     INICIO
========================= -->

<div id="startScreen">

    <div class="title">
        CAPILIANO
    </div>

    <div class="subtitle">
        JUNGLE RUN
    </div>

    <div class="startCapy">
        🦫
    </div>

    <div class="tapText">
        TOCA PARA INICIAR
    </div>

</div>


<!-- =========================
     HUD
========================= -->

<div id="hud">

    <div class="hudBox">
        🪙 <span id="coins">0</span>
    </div>

    <div class="hudBox">
        🏃 <span id="distance">0</span> m
    </div>

</div>


<!-- =========================
     GAME OVER
========================= -->

<div id="gameOver">

    <h1>
        🐊 ¡TE ATRAPÓ!
    </h1>

    <p>

        Recorriste
        <strong>
            <span id="finalDistance">0</span> metros
        </strong>

        <br>

        🪙
        <span id="finalCoins">0</span>
        monedas

    </p>

    <div id="restartText">
        TOCA PARA VOLVER A JUGAR
    </div>

</div>


<script>

/* =========================================================
   CAPILIANO
   JUNGLE RUN
========================================================= */


const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


let W;
let H;


function resize() {

    W =
        canvas.width =
        window.innerWidth;

    H =
        canvas.height =
        window.innerHeight;

}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =========================================================
   ELEMENTOS
========================================================= */

const startScreen =
    document.getElementById(
        "startScreen"
    );

const hud =
    document.getElementById(
        "hud"
    );

const gameOver =
    document.getElementById(
        "gameOver"
    );

const coinsText =
    document.getElementById(
        "coins"
    );

const distanceText =
    document.getElementById(
        "distance"
    );

const finalCoins =
    document.getElementById(
        "finalCoins"
    );

const finalDistance =
    document.getElementById(
        "finalDistance"
    );


/* =========================================================
   ESTADO
========================================================= */

let playing = false;

let lastTime = 0;

let distance = 0;

let coins = 0;

let speed = 0.42;

let lane = 1;

let targetLane = 1;

let jump = 0;

let jumpVelocity = 0;

let rolling = false;

let objects = [];

let trees = [];

let groundMarks = [];

let spawnTimer = 0;

let treeTimer = 0;


/* =========================================================
   GESTOS
========================================================= */

let touchStartX = 0;

let touchStartY = 0;

let touchActive = false;


/* =========================================================
   INICIAR CON CUALQUIER TOQUE
========================================================= */

startScreen.addEventListener(
    "pointerdown",
    startGame
);


gameOver.addEventListener(
    "pointerdown",
    startGame
);


function startGame() {

    playing = true;

    distance = 0;

    coins = 0;

    speed = 0.42;

    lane = 1;

    targetLane = 1;

    jump = 0;

    jumpVelocity = 0;

    rolling = false;

    objects = [];

    trees = [];

    groundMarks = [];

    spawnTimer = 0;

    treeTimer = 0;

    startScreen.style.display =
        "none";

    gameOver.style.display =
        "none";

    hud.style.display =
        "flex";

    lastTime =
        performance.now();

}


/* =========================================================
   GAME OVER
========================================================= */

function endGame() {

    playing = false;

    finalCoins.textContent =
        coins;

    finalDistance.textContent =
        Math.floor(
            distance
        );

    gameOver.style.display =
        "flex";

}


/* =========================================================
   CONTROLES TÁCTILES
========================================================= */

canvas.addEventListener(
    "pointerdown",
    event => {

        if (!playing)
            return;

        touchActive = true;

        touchStartX =
            event.clientX;

        touchStartY =
            event.clientY;

    }
);


canvas.addEventListener(
    "pointerup",
    event => {

        if (!playing ||
            !touchActive)
            return;

        touchActive = false;

        const dx =
            event.clientX -
            touchStartX;

        const dy =
            event.clientY -
            touchStartY;

        const absX =
            Math.abs(dx);

        const absY =
            Math.abs(dy);


        /* toque pequeño */

        if (
            absX < 35 &&
            absY < 35
        ) {

            return;

        }


        /* movimiento horizontal */

        if (
            absX > absY
        ) {

            if (dx < 0)
                moveLeft();

            else
                moveRight();

        }


        /* movimiento vertical */

        else {

            if (dy < 0)
                jumpPlayer();

            else
                rollPlayer();

        }

    }
);


/* =========================================================
   MOVIMIENTO
========================================================= */

function moveLeft() {

    targetLane--;

    if (targetLane < 0)
        targetLane = 0;

}


function moveRight() {

    targetLane++;

    if (targetLane > 2)
        targetLane = 2;

}


function jumpPlayer() {

    if (
        jump === 0 &&
        !rolling
    ) {

        jumpVelocity =
            0.035;

    }

}


function rollPlayer() {

    if (jump === 0) {

        rolling = true;

        setTimeout(
            () => {
                rolling = false;
            },
            650
        );

    }

}


/* =========================================================
   TECLADO
   TAMBIÉN FUNCIONA EN PC
========================================================= */

window.addEventListener(
    "keydown",
    event => {

        if (!playing)
            return;

        if (
            event.key ===
            "ArrowLeft"
        )
            moveLeft();

        if (
            event.key ===
            "ArrowRight"
        )
            moveRight();

        if (
            event.key ===
            "ArrowUp"
        )
            jumpPlayer();

        if (
            event.key ===
            "ArrowDown"
        )
            rollPlayer();

    }
);


/* =========================================================
   PERSPECTIVA
========================================================= */

function horizon() {

    return H * 0.38;

}


function roadDepthY(
    depth
) {

    const top =
        horizon();

    const bottom =
        H * 1.08;

    return (
        top +
        (bottom - top) *
        depth
    );

}


function laneX(
    laneIndex,
    depth
) {

    const center =
        W / 2;

    const spread =
        W * 0.42;

    return (
        center +
        (laneIndex - 1) *
        spread *
        depth
    );

}


/* =========================================================
   FONDO
========================================================= */

function drawSky() {

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    gradient.addColorStop(
        0,
        "#6caf62"
    );

    gradient.addColorStop(
        .5,
        "#9cc76b"
    );

    gradient.addColorStop(
        1,
        "#c3ad63"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

}


/* =========================================================
   VEGETACIÓN LEJANA
========================================================= */

function drawFarJungle() {

    ctx.fillStyle =
        "#235b31";

    ctx.beginPath();

    ctx.moveTo(
        0,
        horizon()
    );

    for (
        let x = 0;
        x <= W;
        x += 30
    ) {

        const y =
            horizon() -
            25 -
            Math.sin(x*.05) *
            20;

        ctx.lineTo(
            x,
            y
        );

    }

    ctx.lineTo(
        W,
        horizon()
    );

    ctx.closePath();

    ctx.fill();

}


/* =========================================================
   CAMINO
========================================================= */

function drawRoad() {

    const h =
        horizon();

    ctx.fillStyle =
        "#8b673d";

    ctx.beginPath();

    ctx.moveTo(
        W*.45,
        h
    );

    ctx.lineTo(
        W*.55,
        h
    );

    ctx.lineTo(
        W*1.08,
        H
    );

    ctx.lineTo(
        -W*.08,
        H
    );

    ctx.closePath();

    ctx.fill();


    /* borde izquierdo */

    ctx.strokeStyle =
        "#5b4028";

    ctx.lineWidth = 8;

    ctx.beginPath();

    ctx.moveTo(
        W*.45,
        h
    );

    ctx.lineTo(
        -W*.08,
        H
    );

    ctx.stroke();


    /* borde derecho */

    ctx.beginPath();

    ctx.moveTo(
        W*.55,
        h
    );

    ctx.lineTo(
        W*1.08,
        H
    );

    ctx.stroke();


    /* separación de zonas */

    ctx.strokeStyle =
        "rgba(255,255,255,.20)";

    ctx.lineWidth = 4;

    ctx.setLineDash([
        30,
        35
    ]);


    for (
        let i = 1;
        i < 3;
        i++
    ) {

        const topX =
            W*.45 +
            i * W*.05;

        const bottomX =
            i * W*.5 -
            W*.05;

        ctx.beginPath();

        ctx.moveTo(
            topX,
            h
        );

        ctx.lineTo(
            bottomX,
            H
        );

        ctx.stroke();

    }

    ctx.setLineDash([]);

}


/* =========================================================
   ÁRBOLES EN MOVIMIENTO
========================================================= */

function createTree() {

    trees.push({

        side:
            Math.random() < .5
            ? -1
            : 1,

        depth: 0,

        size:
            .8 +
            Math.random()*.5

    });

}


function updateTrees(dt) {

    for (
        let i = trees.length-1;
        i >= 0;
        i--
    ) {

        trees[i].depth +=
            speed *
            dt *
            .0018;

        if (
            trees[i].depth >
            1.2
        ) {

            trees.splice(
                i,
                1
            );

        }

    }

}


function drawTrees() {

    for (
        const tree of trees
    ) {

        const d =
            tree.depth;

        const y =
            roadDepthY(d);

        const size =
            (
                20 +
                d * 150
            ) *
            tree.size;

        const x =
            W/2 +
            tree.side *
            (
                W*.34 +
                d*W*.32
            );


        /* tronco */

        ctx.fillStyle =
            "#4d3421";

        ctx.fillRect(
            x - size*.10,
            y - size,
            size*.20,
            size*1.3
        );


        /* copa */

        ctx.fillStyle =
            "#1e5a30";

        ctx.beginPath();

        ctx.arc(
            x,
            y-size,
            size*.65,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle =
            "#2c733c";

        ctx.beginPath();

        ctx.arc(
            x-size*.3,
            y-size*.9,
            size*.4,
            0,
            Math.PI*2
        );

        ctx.arc(
            x+size*.3,
            y-size*.85,
            size*.4,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}


/* =========================================================
   OBJETOS
========================================================= */

function createObject() {

    const random =
        Math.random();

    let type;

    if (
        random < .48
    )
        type = "coin";

    else if (
        random < .74
    )
        type = "log";

    else
        type = "rock";


    objects.push({

        type,

        lane:
            Math.floor(
                Math.random()*3
            ),

        depth: 0

    });

}


/* =========================================================
   ACTUALIZAR OBJETOS
========================================================= */

function updateObjects(dt) {

    for (
        let i =
            objects.length-1;
        i >= 0;
        i--
    ) {

        const object =
            objects[i];


        object.depth +=
            speed *
            dt *
            .0019;


        if (
            object.depth >
            1.15
        ) {

            objects.splice(
                i,
                1
            );

            continue;

        }


        checkObjectCollision(
            object,
            i
        );

    }

}


/* =========================================================
   DIBUJAR OBJETOS
========================================================= */

function drawObjects() {

    for (
        const object
        of objects
    ) {

        const d =
            object.depth;

        const x =
            laneX(
                object.lane,
                d
            );

        const y =
            roadDepthY(d);


        const size =
            10 +
            d * 65;


        if (
            object.type ===
            "coin"
        ) {

            ctx.fillStyle =
                "#f3c43e";

            ctx.beginPath();

            ctx.arc(
                x,
                y-size,
                size*.27,
                0,
                Math.PI*2
            );

            ctx.fill();


            ctx.strokeStyle =
                "#fff2a3";

            ctx.lineWidth =
                Math.max(
                    1,
                    d*4
                );

            ctx.stroke();

        }


        if (
            object.type ===
            "log"
        ) {

            ctx.fillStyle =
                "#573a25";

            ctx.fillRect(
                x-size,
                y-size*.35,
                size*2,
                size*.7
            );

            ctx.fillStyle =
                "#8a6240";

            ctx.beginPath();

            ctx.arc(
                x-size,
                y,
                size*.35,
                0,
                Math.PI*2
            );

            ctx.fill();

        }


        if (
            object.type ===
            "rock"
        ) {

            ctx.fillStyle =
                "#59645a";

            ctx.beginPath();

            ctx.moveTo(
                x-size,
                y
            );

            ctx.lineTo(
                x-size*.55,
                y-size
            );

            ctx.lineTo(
                x+size*.35,
                y-size*.85
            );

            ctx.lineTo(
                x+size,
                y
            );

            ctx.closePath();

            ctx.fill();

        }

    }

}


/* =========================================================
   COLISIONES
========================================================= */

function checkObjectCollision(
    object,
    index
) {

    if (
        object.depth < .76 ||
        object.depth > .96
    )
        return;


    if (
        object.lane !==
        Math.round(lane)
    )
        return;


    /* moneda */

    if (
        object.type ===
        "coin"
    ) {

        coins++;

        objects.splice(
            index,
            1
        );

        return;

    }


    /* tronco */

    if (
        object.type ===
        "log"
    ) {

        if (
            jump < .12
        ) {

            endGame();

        }

    }


    /* roca */

    if (
        object.type ===
        "rock"
    ) {

        if (
            jump < .12 &&
            !rolling
        ) {

            endGame();

        }

    }

}


/* =========================================================
   CAPIBARA
========================================================= */

function drawCapybara() {

    const x =
        W/2 +
        (
            lane - 1
        ) *
        W*.22;


    const baseY =
        H*.79 -
        jump*H*.28;


    ctx.save();

    ctx.translate(
        x,
        baseY
    );


    if (
        rolling
    ) {

        ctx.rotate(
            -.25
        );

    }


    /* sombra */

    ctx.fillStyle =
        "rgba(0,0,0,.25)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        28,
        55,
        13,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* cuerpo */

    ctx.fillStyle =
        "#805b3b";

    ctx.beginPath();

    ctx.ellipse(
        0,
        0,
        53,
        35,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* cabeza */

    ctx.beginPath();

    ctx.ellipse(
        42,
        -18,
        32,
        27,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* oreja */

    ctx.beginPath();

    ctx.arc(
        29,
        -40,
        9,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* ojo */

    ctx.fillStyle =
        "#111";

    ctx.beginPath();

    ctx.arc(
        52,
        -23,
        4,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* nariz */

    ctx.beginPath();

    ctx.arc(
        68,
        -11,
        5,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* patas */

    ctx.fillStyle =
        "#65452e";

    ctx.fillRect(
        -28,
        21,
        10,
        25
    );

    ctx.fillRect(
        20,
        21,
        10,
        25
    );


    ctx.restore();

}


/* =========================================================
   COCODRILO
========================================================= */

function drawCrocodile() {

    const x =
        W/2;

    const y =
        H*.92;


    ctx.save();

    ctx.translate(
        x,
        y
    );


    /* cola */

    ctx.strokeStyle =
        "#315c39";

    ctx.lineWidth =
        24;

    ctx.lineCap =
        "round";

    ctx.beginPath();

    ctx.moveTo(
        -110,
        20
    );

    ctx.quadraticCurveTo(
        -50,
        45,
        0,
        25
    );

    ctx.stroke();


    /* cuerpo */

    ctx.fillStyle =
        "#315e3a";

    ctx.beginPath();

    ctx.ellipse(
        0,
        20,
        90,
        28,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* cabeza */

    ctx.fillStyle =
        "#467b49";

    ctx.beginPath();

    ctx.ellipse(
        65,
        5,
        48,
        28,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* ojo */

    ctx.fillStyle =
        "#fff";

    ctx.beginPath();

    ctx.arc(
        72,
        -12,
        6,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle =
        "#111";

    ctx.beginPath();

    ctx.arc(
        73,
        -12,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* dientes */

    ctx.fillStyle =
        "#f1f1e8";

    for (
        let i=0;
        i<6;
        i++
    ) {

        ctx.beginPath();

        ctx.moveTo(
            42+i*9,
            21
        );

        ctx.lineTo(
            46+i*9,
            34
        );

        ctx.lineTo(
            51+i*9,
            21
        );

        ctx.fill();

    }


    ctx.restore();

}


/* =========================================================
   SALTO
========================================================= */

function updateJump() {

    if (
        jumpVelocity !== 0
    ) {

        jump +=
            jumpVelocity;

        jumpVelocity -=
            .0015;


        if (
            jump <= 0
        ) {

            jump = 0;

            jumpVelocity = 0;

        }

    }

}


/* =========================================================
   GENERACIÓN
========================================================= */

function generateWorld(dt) {

    spawnTimer -=
        dt;

    treeTimer -=
        dt;


    if (
        spawnTimer <= 0
    ) {

        createObject();

        /*
         * A veces aparecen
         * varias monedas
         */

        if (
            Math.random() < .3
        ) {

            const last =
                objects[
                    objects.length-1
                ];


            if (
                last &&
                last.type ===
                "coin"
            ) {

                objects.push({

                    type: "coin",

                    lane:
                        (last.lane + 1) % 3,

                    depth:
                        -.08

                });

            }

        }


        spawnTimer =
            Math.max(
                .45,
                .95 -
                speed*.35
            );

    }


    if (
        treeTimer <= 0
    ) {

        createTree();

        createTree();

        treeTimer =
            .35;

    }

}


/* =========================================================
   ACTUALIZACIÓN
========================================================= */

function update(dt) {

    if (!playing)
        return;


    distance +=
        speed *
        dt *
        0.06;


    speed +=
        dt *
        .003;


    if (
        speed > 1.25
    )
        speed = 1.25;


    lane =
        lane +
        (
            targetLane -
            lane
        ) *
        Math.min(
            1,
            dt*.012
        );


    updateJump();

    generateWorld(
        dt
    );

    updateObjects(
        dt
    );

    updateTrees(
        dt
    );


    coinsText.textContent =
        coins;

    distanceText.textContent =
        Math.floor(
            distance
        );

}


/* =========================================================
   DIBUJAR
========================================================= */

function draw() {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    drawSky();

    drawFarJungle();

    drawRoad();

    drawTrees();

    drawObjects();

    drawCrocodile();

    drawCapybara();

}


/* =========================================================
   LOOP PRINCIPAL
========================================================= */

function loop(time) {

    const dt =
        Math.min(
            50,
            time - lastTime
        );

    lastTime =
        time;


    if (playing) {

        update(dt);

    }


    draw();


    requestAnimationFrame(
        loop
    );

}


/* =========================================================
   COMENZAR RENDER
========================================================= */

requestAnimationFrame(
    loop
);

</script>

</body>
</html>
