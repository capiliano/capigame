<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAPILIANO - Jungle Run</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #07130c;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
}

/* =========================
   PANTALLA DE INICIO
========================= */

#menu {
    position: fixed;
    inset: 0;
    z-index: 10;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            rgba(2,20,10,.35),
            rgba(1,10,5,.85)
        );

    text-align: center;
}

.logo {
    font-size: clamp(45px, 10vw, 95px);
    font-weight: 1000;
    letter-spacing: 5px;

    text-shadow:
        0 5px 0 #284d22,
        0 10px 30px rgba(0,0,0,.8);
}

.subtitle {
    margin-top: 8px;
    font-size: clamp(13px, 3vw, 20px);
    letter-spacing: 5px;
    opacity: .85;
}

.capybara-preview {
    font-size: 100px;
    margin: 25px 0;
    animation: bounce 1.4s infinite ease-in-out;
}

@keyframes bounce {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-12px);
    }

}

#startButton {

    border: none;

    padding: 18px 65px;

    border-radius: 50px;

    background: #d6a83a;

    color: #171006;

    font-size: 25px;

    font-weight: 1000;

    letter-spacing: 3px;

    cursor: pointer;

    box-shadow:
        0 8px 0 #80621d,
        0 15px 35px rgba(0,0,0,.5);

    transition: .15s;

}

#startButton:hover {

    transform: translateY(-3px);

}

#startButton:active {

    transform: translateY(5px);

    box-shadow:
        0 3px 0 #80621d;

}

/* =========================
   HUD
========================= */

#hud {

    position: fixed;

    top: 18px;

    left: 18px;

    right: 18px;

    z-index: 5;

    display: none;

    justify-content: space-between;

    pointer-events: none;

}

.stat {

    background: rgba(0,0,0,.45);

    backdrop-filter: blur(8px);

    border: 1px solid rgba(255,255,255,.15);

    padding: 9px 15px;

    border-radius: 30px;

    font-weight: bold;

}

/* =========================
   CONTROLES
========================= */

#controls {

    position: fixed;

    bottom: 20px;

    left: 50%;

    transform: translateX(-50%);

    z-index: 6;

    display: none;

    grid-template-columns:
        repeat(3, 70px);

    gap: 10px;

}

.control {

    width: 70px;

    height: 55px;

    border-radius: 15px;

    border: 1px solid rgba(255,255,255,.2);

    background: rgba(0,0,0,.5);

    color: white;

    font-size: 24px;

    font-weight: bold;

    backdrop-filter: blur(8px);

}

.control:active {

    transform: scale(.92);

}

.jump {

    grid-column: 2;

}

.roll {

    grid-column: 2;

}

/* =========================
   GAME OVER
========================= */

#gameOver {

    position: fixed;

    inset: 0;

    z-index: 20;

    display: none;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    background: rgba(0,0,0,.7);

}

#gameOver h1 {

    font-size: clamp(35px,8vw,70px);

    margin-bottom: 15px;

}

#gameOver p {

    font-size: 20px;

    margin-bottom: 25px;

}

#restartButton {

    padding: 15px 40px;

    border: none;

    border-radius: 40px;

    background: #d6a83a;

    font-weight: 900;

    font-size: 18px;

    cursor: pointer;

}

</style>
</head>

<body>

<canvas id="game"></canvas>


<!-- =========================
     MENU
========================= -->

<div id="menu">

    <div class="logo">
        CAPILIANO
    </div>

    <div class="subtitle">
        JUNGLE RUN
    </div>

    <div class="capybara-preview">
        🦫
    </div>

    <button id="startButton">
        START
    </button>

</div>


<!-- =========================
     HUD
========================= -->

<div id="hud">

    <div class="stat">
        🪙 <span id="coins">0</span>
    </div>

    <div class="stat">
        🏃 <span id="distance">0</span> m
    </div>

</div>


<!-- =========================
     CONTROLES
========================= -->

<div id="controls">

    <button class="control" id="left">←</button>

    <button class="control" id="right">→</button>

    <button class="control jump" id="jump">↑</button>

    <button class="control roll" id="roll">↓</button>

</div>


<!-- =========================
     GAME OVER
========================= -->

<div id="gameOver">

    <h1>🐊 ¡TE ATRAPÓ!</h1>

    <p>
        Recorriste <b><span id="finalDistance">0</span> metros</b>
        <br>
        🪙 <span id="finalCoins">0</span> monedas
    </p>

    <button id="restartButton">
        VOLVER A JUGAR
    </button>

</div>


<script>

/* ==========================================================
   CAPILIANO - JUNGLE RUN
========================================================== */

const canvas = document.getElementById("game");

const ctx = canvas.getContext("2d");

let W;
let H;

function resize() {

    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;

}

resize();

window.addEventListener("resize", resize);


/* ==========================================================
   ELEMENTOS
========================================================== */

const menu =
    document.getElementById("menu");

const startButton =
    document.getElementById("startButton");

const hud =
    document.getElementById("hud");

const controls =
    document.getElementById("controls");

const gameOver =
    document.getElementById("gameOver");

const restartButton =
    document.getElementById("restartButton");

const coinsText =
    document.getElementById("coins");

const distanceText =
    document.getElementById("distance");

const finalCoins =
    document.getElementById("finalCoins");

const finalDistance =
    document.getElementById("finalDistance");


/* ==========================================================
   ESTADO DEL JUEGO
========================================================== */

let playing = false;

let gameTime = 0;

let distance = 0;

let coins = 0;

let speed = 0.35;

let lane = 1;

let targetLane = 1;

let jumpHeight = 0;

let jumpVelocity = 0;

let rolling = false;

let objects = [];

let particles = [];

let spawnTimer = 0;


/* ==========================================================
   CONFIGURACIÓN
========================================================== */

const lanes = [-1, 0, 1];


/* ==========================================================
   INICIAR
========================================================== */

startButton.addEventListener("click", startGame);

restartButton.addEventListener("click", startGame);


function startGame() {

    playing = true;

    gameTime = 0;

    distance = 0;

    coins = 0;

    speed = 0.35;

    lane = 1;

    targetLane = 1;

    jumpHeight = 0;

    jumpVelocity = 0;

    rolling = false;

    objects = [];

    particles = [];

    spawnTimer = 0;

    menu.style.display = "none";

    gameOver.style.display = "none";

    hud.style.display = "flex";

    controls.style.display = "grid";

}


/* ==========================================================
   FINAL
========================================================== */

function endGame() {

    playing = false;

    finalCoins.textContent = coins;

    finalDistance.textContent =
        Math.floor(distance);

    gameOver.style.display = "flex";

}


/* ==========================================================
   CONTROLES
========================================================== */

function moveLeft() {

    if (!playing) return;

    targetLane--;

    if (targetLane < 0)
        targetLane = 0;

}


function moveRight() {

    if (!playing) return;

    targetLane++;

    if (targetLane > 2)
        targetLane = 2;

}


function jump() {

    if (!playing) return;

    if (jumpHeight === 0) {

        jumpVelocity = 0.027;

    }

}


function roll() {

    if (!playing) return;

    rolling = true;

    setTimeout(() => {

        rolling = false;

    }, 600);

}


document.getElementById("left")
    .addEventListener("pointerdown", moveLeft);

document.getElementById("right")
    .addEventListener("pointerdown", moveRight);

document.getElementById("jump")
    .addEventListener("pointerdown", jump);

document.getElementById("roll")
    .addEventListener("pointerdown", roll);


/* ==========================================================
   TECLADO
========================================================== */

window.addEventListener("keydown", e => {

    if (e.key === "ArrowLeft")
        moveLeft();

    if (e.key === "ArrowRight")
        moveRight();

    if (e.key === "ArrowUp")
        jump();

    if (e.key === "ArrowDown")
        roll();

});


/* ==========================================================
   UTILIDADES
========================================================== */

function lerp(a,b,t) {

    return a + (b-a)*t;

}


function laneX(laneIndex, depth = 1) {

    const center = W / 2;

    const spread =
        W * 0.22;

    return center +
        lanes[laneIndex] *
        spread *
        depth;

}


function roadY(depth) {

    const horizon =
        H * 0.38;

    const bottom =
        H * 1.05;

    return horizon +
        (bottom-horizon) *
        depth;

}


/* ==========================================================
   SELVA
========================================================== */

function drawJungle() {

    /* cielo */

    const sky =
        ctx.createLinearGradient(
            0,0,0,H
        );

    sky.addColorStop(
        0,
        "#70b96b"
    );

    sky.addColorStop(
        1,
        "#d1c77b"
    );

    ctx.fillStyle = sky;

    ctx.fillRect(
        0,0,W,H
    );


    /* vegetación */

    for(let i=0;i<18;i++){

        const side =
            i % 2 === 0
            ? 0
            : W;

        const x =
            side === 0
            ? i * 55
            : W - i * 55;

        const y =
            H * .25 +
            (i % 5) * 35;

        ctx.fillStyle =
            "#174b29";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            65,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /* hojas */

    for(let i=0;i<30;i++){

        const x =
            (i * 137) % W;

        const y =
            (i * 61) % (H*.5);

        ctx.fillStyle =
            "rgba(25,90,43,.65)";

        ctx.beginPath();

        ctx.ellipse(
            x,
            y,
            45,
            12,
            i,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}


/* ==========================================================
   CAMINO
========================================================== */

function drawRoad() {

    const horizon =
        H * .38;

    const bottom =
        H * 1.1;


    ctx.fillStyle =
        "#8b6239";

    ctx.beginPath();

    ctx.moveTo(
        W*.43,
        horizon
    );

    ctx.lineTo(
        W*.57,
        horizon
    );

    ctx.lineTo(
        W*.95,
        bottom
    );

    ctx.lineTo(
        W*.05,
        bottom
    );

    ctx.closePath();

    ctx.fill();


    /* bordes */

    ctx.strokeStyle =
        "#5b4027";

    ctx.lineWidth = 8;

    ctx.beginPath();

    ctx.moveTo(
        W*.43,
        horizon
    );

    ctx.lineTo(
        W*.05,
        bottom
    );

    ctx.moveTo(
        W*.57,
        horizon
    );

    ctx.lineTo(
        W*.95,
        bottom
    );

    ctx.stroke();


    /* líneas de los carriles */

    ctx.strokeStyle =
        "rgba(255,255,255,.18)";

    ctx.lineWidth = 4;

    ctx.setLineDash([
        25,
        30
    ]);

    for(let i=1;i<3;i++){

        const topX =
            W*.43 +
            i * W*.07;

        const bottomX =
            W*.05 +
            i * W*.45;

        ctx.beginPath();

        ctx.moveTo(
            topX,
            horizon
        );

        ctx.lineTo(
            bottomX,
            bottom
        );

        ctx.stroke();

    }

    ctx.setLineDash([]);

}


/* ==========================================================
   ÁRBOLES
========================================================== */

function drawTrees() {

    for(let i=0;i<12;i++){

        const depth =
            ((i*.17 +
            gameTime*.00025) % 1);

        const y =
            roadY(depth);

        const size =
            20 +
            depth * 90;

        const side =
            i % 2 === 0
            ? -1
            : 1;

        const x =
            W/2 +
            side *
            (W*.35 +
            depth*W*.25);


        ctx.fillStyle =
            "#4b3220";

        ctx.fillRect(
            x-size*.15,
            y-size,
            size*.3,
            size*1.2
        );


        ctx.fillStyle =
            "#1e5b2f";

        ctx.beginPath();

        ctx.arc(
            x,
            y-size,
            size*.65,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}


/* ==========================================================
   CAPIBARA
========================================================== */

function drawCapybara() {

    const x =
        lerp(
            laneX(lane),
            laneX(targetLane),
            .18
        );

    lane =
        lerp(
            lane,
            targetLane,
            .18
        );


    const baseY =
        H*.79 -
        jumpHeight;


    ctx.save();

    ctx.translate(
        x,
        baseY
    );


    if(rolling){

        ctx.rotate(
            -.15
        );

    }


    /* sombra */

    ctx.fillStyle =
        "rgba(0,0,0,.25)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        25,
        55,
        12,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* cuerpo */

    ctx.fillStyle =
        "#825c3b";

    ctx.beginPath();

    ctx.ellipse(
        0,
        0,
        52,
        35,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* cabeza */

    ctx.beginPath();

    ctx.ellipse(
        40,
        -17,
        32,
        27,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* oreja */

    ctx.beginPath();

    ctx.arc(
        28,
        -40,
        9,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* ojo */

    ctx.fillStyle =
        "#111";

    ctx.beginPath();

    ctx.arc(
        50,
        -22,
        4,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* nariz */

    ctx.beginPath();

    ctx.arc(
        67,
        -10,
        5,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* patas */

    ctx.fillStyle =
        "#68482f";

    ctx.fillRect(
        -28,
        22,
        10,
        24
    );

    ctx.fillRect(
        20,
        22,
        10,
        24
    );


    ctx.restore();

}


/* ==========================================================
   COCODRILO
========================================================== */

function drawCrocodile() {

    const x =
        W/2;

    const y =
        H*.91;


    ctx.save();

    ctx.translate(
        x,
        y
    );


    /* cuerpo */

    ctx.fillStyle =
        "#315e3a";

    ctx.beginPath();

    ctx.ellipse(
        0,
        25,
        105,
        30,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* cabeza */

    ctx.fillStyle =
        "#477c4b";

    ctx.beginPath();

    ctx.ellipse(
        75,
        8,
        55,
        30,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* ojos */

    ctx.fillStyle =
        "#fff";

    ctx.beginPath();

    ctx.arc(
        75,
        -13,
        7,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle =
        "#111";

    ctx.beginPath();

    ctx.arc(
        77,
        -13,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* dientes */

    ctx.fillStyle =
        "#eee";

    for(let i=0;i<6;i++){

        ctx.beginPath();

        ctx.moveTo(
            50+i*10,
            24
        );

        ctx.lineTo(
            55+i*10,
            37
        );

        ctx.lineTo(
            60+i*10,
            24
        );

        ctx.fill();

    }


    ctx.restore();

}


/* ==========================================================
   OBJETOS
========================================================== */

function createObject() {

    const typeRandom =
        Math.random();

    let type;

    if(typeRandom < .45)
        type = "coin";

    else if(typeRandom < .72)
        type = "log";

    else
        type = "rock";


    objects.push({

        type,

        lane:
            Math.floor(
                Math.random()*3
            ),

        depth: 0

    });

}


/* ==========================================================
   DIBUJAR OBJETOS
========================================================== */

function drawObjects() {

    for(const obj of objects){

        obj.depth +=
            speed *
            .012;


        if(obj.depth > 1.1)
            continue;


        const x =
            laneX(
                obj.lane,
                obj.depth
            );

        const y =
            roadY(
                obj.depth
            );

        const size =
            10 +
            obj.depth * 65;


        ctx.save();

        ctx.translate(
            x,
            y
        );


        if(obj.type === "coin"){

            ctx.fillStyle =
                "#f4c542";

            ctx.beginPath();

            ctx.arc(
                0,
                -size,
                size*.25,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.strokeStyle =
                "#fff1a3";

            ctx.lineWidth = 3;

            ctx.stroke();

        }


        if(obj.type === "log"){

            ctx.fillStyle =
                "#593c26";

            ctx.rotate(.1);

            ctx.fillRect(
                -size,
                -size*.25,
                size*2,
                size*.5
            );

        }


        if(obj.type === "rock"){

            ctx.fillStyle =
                "#59645b";

            ctx.beginPath();

            ctx.moveTo(
                -size,
                0
            );

            ctx.lineTo(
                -size*.5,
                -size
            );

            ctx.lineTo(
                size*.5,
                -size*.8
            );

            ctx.lineTo(
                size,
                0
            );

            ctx.closePath();

            ctx.fill();

        }


        ctx.restore();

    }

}


/* ==========================================================
   COLISIONES
========================================================== */

function checkCollisions() {

    for(let i=objects.length-1;i>=0;i--){

        const obj =
            objects[i];


        if(obj.depth > .72 &&
           obj.depth < .95 &&
           obj.lane ===
           Math.round(lane)){

            if(obj.type === "coin"){

                coins++;

                objects.splice(
                    i,
                    1
                );

            }

            else if(obj.type === "log"){

                if(jumpHeight < .12){

                    endGame();

                }

            }

            else if(obj.type === "rock"){

                if(jumpHeight < .1 &&
                   !rolling){

                    endGame();

                }

            }

        }

    }

}


/* ==========================================================
   ACTUALIZAR SALTO
========================================================== */

function updateJump() {

    if(jumpVelocity !== 0){

        jumpHeight +=
            jumpVelocity;

        jumpVelocity -=
            .0012;


        if(jumpHeight <= 0){

            jumpHeight = 0;

            jumpVelocity = 0;

        }

    }

}


/* ==========================================================
   ACTUALIZAR JUEGO
========================================================== */

function update() {

    if(!playing)
        return;


    gameTime++;


    distance +=
        speed;


    speed +=
        .00015;


    if(speed > .95)
        speed = .95;


    spawnTimer--;


    if(spawnTimer <= 0){

        createObject();

        spawnTimer =
            Math.max(
                30,
                75 -
                speed*25
            );

    }


    updateJump();

    checkCollisions();


    /* limpiar */

    objects =
        objects.filter(
            obj =>
                obj.depth < 1.15
        );


    coinsText.textContent =
        coins;

    distanceText.textContent =
        Math.floor(
            distance/10
        );

}


/* ==========================================================
   DIBUJAR
========================================================== */

function draw() {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    drawJungle();

    drawRoad();

    drawTrees();

    drawObjects();

    drawCrocodile();

    drawCapybara();

}


/* ==========================================================
   LOOP
========================================================== */

function gameLoop() {

    update();

    draw();

    requestAnimationFrame(
        gameLoop
    );

}

gameLoop();


</script>

</body>
</html>
