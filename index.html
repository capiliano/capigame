<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CAPILIANO — Jungle Run</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #07140c;
    font-family: Arial, Helvetica, sans-serif;
    touch-action: none;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
}

.overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
    background:
        radial-gradient(circle at center, rgba(25,80,40,.55), rgba(3,15,9,.96));
    transition: opacity .35s ease;
    pointer-events: auto;
}

.overlay.hidden {
    opacity: 0;
    pointer-events: none;
}

.menu {
    padding: 30px;
}

.logo {
    font-size: clamp(42px, 12vw, 82px);
    font-weight: 900;
    letter-spacing: -3px;
    text-shadow:
        0 5px 0 #152b16,
        0 0 30px rgba(100,255,130,.25);
}

.subtitle {
    margin-top: -5px;
    font-size: 16px;
    letter-spacing: 7px;
    opacity: .8;
}

.capy-icon {
    font-size: 75px;
    margin: 25px 0;
    animation: floating 1.6s ease-in-out infinite;
}

.tap {
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 2px;
    animation: pulse 1.2s ease-in-out infinite;
}

.small {
    margin-top: 20px;
    font-size: 12px;
    opacity: .55;
    line-height: 1.6;
}

@keyframes floating {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
}

@keyframes pulse {
    0%,100% { opacity: .45; }
    50% { opacity: 1; }
}

#hud {
    position: fixed;
    z-index: 5;
    top: 18px;
    left: 18px;
    right: 18px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    color: white;
    font-weight: bold;
    font-size: 17px;
    text-shadow: 0 2px 4px #000;
}

.hudBox {
    padding: 9px 13px;
    border-radius: 14px;
    background: rgba(0,0,0,.28);
    backdrop-filter: blur(5px);
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
    <div class="hudBox">🪙 <span id="coins">0</span></div>
    <div class="hudBox">🏃 <span id="distance">0</span> m</div>
</div>

<div id="startScreen" class="overlay">
    <div class="menu">
        <div class="logo">CAPILIANO</div>
        <div class="subtitle">JUNGLE RUN</div>

        <div class="capy-icon">🦫</div>

        <div class="tap">TOCA PARA INICIAR</div>

        <div class="small">
            ← → cambiar de dirección<br>
            ↑ saltar · ↓ rodar
        </div>
    </div>
</div>

<div id="gameOver" class="overlay hidden">
    <div class="menu">
        <div class="logo" style="font-size:48px;">¡TE ATRAPÓ!</div>

        <div class="capy-icon">🐊</div>

        <div id="finalStats" class="tap"></div>

        <div class="tap" style="margin-top:25px;">
            TOCA PARA VOLVER A JUGAR
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;
let dpr = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resize);
resize();

/* =========================
   ESTADO DEL JUEGO
========================= */

let running = false;
let gameOver = false;

let coins = 0;
let distance = 0;

let speed = 0.48;
let maxSpeed = 1.25;

let lane = 1;
let targetLane = 1;

let playerY = 0;
let verticalVelocity = 0;

let jumping = false;
let rolling = false;
let rollTimer = 0;

let runTime = 0;
let cameraShake = 0;

let worldObjects = [];
let jungleObjects = [];

let spawnTimer = 0;
let coinTimer = 0;
let treeTimer = 0;

let lastTime = performance.now();

/* =========================
   UTILIDADES
========================= */

function rand(min, max) {
    return Math.random() * (max - min) + min;
}

function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
}

/* =========================
   PERSPECTIVA
========================= */

function horizonY() {
    return H * 0.40;
}

function groundY() {
    return H * 0.96;
}

function depthY(z) {
    return horizonY() + (groundY() - horizonY()) * Math.pow(z, 1.35);
}

function laneX(l, z) {
    const center = W / 2;

    // Los carriles se separan mucho más cerca de la cámara.
    const spread = W * 0.14 * (0.18 + z * 1.2);

    return center + (l - 1) * spread;
}

function objectScale(z) {
    return 0.18 + z * 1.35;
}

/* =========================
   INICIAR / REINICIAR
========================= */

function startGame() {
    running = true;
    gameOver = false;

    coins = 0;
    distance = 0;

    speed = 0.48;

    lane = 1;
    targetLane = 1;

    playerY = 0;
    verticalVelocity = 0;

    jumping = false;
    rolling = false;
    rollTimer = 0;

    runTime = 0;
    cameraShake = 0;

    worldObjects = [];
    jungleObjects = [];

    spawnTimer = .2;
    coinTimer = .4;
    treeTimer = .1;

    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("gameOver").classList.add("hidden");

    updateHUD();
}

/* =========================
   GAME OVER
========================= */

function endGame() {
    if (!running) return;

    running = false;
    gameOver = true;

    document.getElementById("finalStats").innerHTML =
        `Distancia: ${Math.floor(distance)} m<br>🪙 Monedas: ${coins}`;

    document.getElementById("gameOver").classList.remove("hidden");
}

/* =========================
   MOVIMIENTO
========================= */

function moveLeft() {
    if (!running) return;

    targetLane = clamp(targetLane - 1, 0, 2);
}

function moveRight() {
    if (!running) return;

    targetLane = clamp(targetLane + 1, 0, 2);
}

function jump() {
    if (!running || jumping || rolling) return;

    jumping = true;
    verticalVelocity = 0.95;
}

function roll() {
    if (!running || jumping || rolling) return;

    rolling = true;
    rollTimer = 0.65;
}

/* =========================
   CONTROLES TÁCTILES
========================= */

let touchStartX = 0;
let touchStartY = 0;
let touchStartTime = 0;

canvas.addEventListener("pointerdown", e => {

    touchStartX = e.clientX;
    touchStartY = e.clientY;
    touchStartTime = performance.now();

    if (!running && !gameOver) {
        startGame();
    }

    if (!running && gameOver) {
        startGame();
    }
});

canvas.addEventListener("pointerup", e => {

    if (!running) return;

    const dx = e.clientX - touchStartX;
    const dy = e.clientY - touchStartY;

    const distanceTouch = Math.sqrt(dx * dx + dy * dy);

    // Toque corto: salto
    if (distanceTouch < 25) {
        jump();
        return;
    }

    if (Math.abs(dx) > Math.abs(dy)) {

        if (Math.abs(dx) > 35) {
            if (dx > 0) {
                moveRight();
            } else {
                moveLeft();
            }
        }

    } else {

        if (Math.abs(dy) > 35) {

            if (dy < 0) {
                jump();
            } else {
                roll();
            }
        }
    }
});

/* =========================
   TECLADO
========================= */

window.addEventListener("keydown", e => {

    if (!running && !gameOver) {
        startGame();
        return;
    }

    if (gameOver) {
        startGame();
        return;
    }

    if (e.key === "ArrowLeft" || e.key === "a")
        moveLeft();

    if (e.key === "ArrowRight" || e.key === "d")
        moveRight();

    if (e.key === "ArrowUp" || e.key === "w" || e.key === " ")
        jump();

    if (e.key === "ArrowDown" || e.key === "s")
        roll();
});

/* =========================
   GENERACIÓN DEL MUNDO
========================= */

function createObstacle() {

    const typeRandom = Math.random();

    let type;

    if (typeRandom < .48)
        type = "rock";
    else if (typeRandom < .78)
        type = "log";
    else
        type = "branch";

    worldObjects.push({
        type,
        lane: Math.floor(Math.random() * 3),
        z: 0.02,
        hit: false,
        wobble: Math.random() * Math.PI * 2
    });
}

function createCoinLine() {

    const selectedLane = Math.floor(Math.random() * 3);

    const amount = Math.floor(rand(3, 7));

    for (let i = 0; i < amount; i++) {

        worldObjects.push({
            type: "coin",
            lane: selectedLane,
            z: 0.02 - i * 0.075,
            collected: false,
            rotation: Math.random() * Math.PI * 2
        });
    }
}

function createTree() {

    const side = Math.random() < .5 ? -1 : 1;

    jungleObjects.push({
        side,
        z: 0.02,
        offset: rand(0.02, .20),
        size: rand(.8, 1.25),
        type: Math.random() < .5 ? "tree" : "bush"
    });
}

/* =========================
   ACTUALIZAR
========================= */

function update(dt) {

    if (!running) return;

    // dt ahora está en segundos.
    runTime += dt;

    // El juego acelera progresivamente.
    speed = Math.min(
        maxSpeed,
        0.48 + distance * 0.0008
    );

    distance += speed * dt * 95;

    /* Cambio de carril suave */

    lane += (targetLane - lane) * Math.min(1, dt * 12);

    /* Salto */

    if (jumping) {

        playerY += verticalVelocity * dt * 2.8;
        verticalVelocity -= 2.45 * dt;

        if (playerY <= 0) {
            playerY = 0;
            jumping = false;
            verticalVelocity = 0;
        }
    }

    /* Rodar */

    if (rolling) {

        rollTimer -= dt;

        if (rollTimer <= 0) {
            rolling = false;
        }
    }

    /* Generación */

    spawnTimer -= dt;

    if (spawnTimer <= 0) {

        createObstacle();

        // Más rápido conforme avanza.
        spawnTimer = rand(.65, 1.05) / (0.8 + speed * .35);
    }

    coinTimer -= dt;

    if (coinTimer <= 0) {

        createCoinLine();

        coinTimer = rand(1.0, 1.8);
    }

    treeTimer -= dt;

    if (treeTimer <= 0) {

        createTree();

        if (Math.random() < .7)
            createTree();

        treeTimer = rand(.18, .35);
    }

    /* Objetos */

    for (let i = worldObjects.length - 1; i >= 0; i--) {

        const obj = worldObjects[i];

        obj.z += speed * dt * 0.95;

        if (obj.type === "coin") {
            obj.rotation += dt * 7;
        }

        if (obj.z > 1.12) {
            worldObjects.splice(i, 1);
            continue;
        }

        checkCollision(obj);
    }

    /* Vegetación */

    for (let i = jungleObjects.length - 1; i >= 0; i--) {

        const tree = jungleObjects[i];

        tree.z += speed * dt * .9;

        if (tree.z > 1.15) {
            jungleObjects.splice(i, 1);
        }
    }

    if (cameraShake > 0) {
        cameraShake -= dt;
    }

    updateHUD();
}

/* =========================
   COLISIONES
========================= */

function checkCollision(obj) {

    if (obj.hit || obj.collected) return;

    // Zona donde el objeto está cerca del jugador.
    if (obj.z < .78 || obj.z > .98) return;

    const playerLane = Math.round(lane);

    if (obj.lane !== playerLane) return;

    if (obj.type === "coin") {

        obj.collected = true;

        coins++;

        cameraShake = .04;

        return;
    }

    /*
      Obstáculos:
      saltando = evita
      rodando = evita ramas
    */

    if (obj.type === "branch" && rolling) {
        obj.hit = true;
        return;
    }

    if (jumping && playerY > .15) {
        obj.hit = true;
        return;
    }

    endGame();
}

/* =========================
   HUD
========================= */

function updateHUD() {

    document.getElementById("coins").textContent = coins;
    document.getElementById("distance").textContent =
        Math.floor(distance);
}

/* =========================
   DIBUJO DEL CIELO
========================= */

function drawSky() {

    const gradient = ctx.createLinearGradient(0, 0, 0, H);

    gradient.addColorStop(0, "#75c8e8");
    gradient.addColorStop(.45, "#b4e2c0");
    gradient.addColorStop(.7, "#4b8f4a");
    gradient.addColorStop(1, "#17391d");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);
}

/* =========================
   SELVA LEJANA
========================= */

function drawDistantJungle() {

    const horizon = horizonY();

    ctx.fillStyle = "#1f6335";

    ctx.beginPath();

    ctx.moveTo(0, horizon + 30);

    for (let x = 0; x <= W; x += 35) {

        const y =
            horizon +
            Math.sin(x * .025) * 15 +
            Math.sin(x * .07) * 9 +
            10;

        ctx.lineTo(x, y);
    }

    ctx.lineTo(W, horizon + 120);
    ctx.lineTo(0, horizon + 120);

    ctx.closePath();
    ctx.fill();

    // Copas
    for (let x = -20; x < W + 40; x += 45) {

        const y = horizon + rand(-5, 35);

        ctx.fillStyle = "#174b28";

        ctx.beginPath();
        ctx.arc(x, y, rand(25, 48), 0, Math.PI * 2);
        ctx.fill();
    }
}

/* =========================
   CAMINO
========================= */

function drawPath() {

    const h = horizonY();

    // Zona de tierra
    ctx.fillStyle = "#4f7a3c";

    ctx.beginPath();
    ctx.moveTo(0, h);
    ctx.lineTo(W, h);
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.closePath();
    ctx.fill();

    // Camino trapezoidal
    ctx.fillStyle = "#9b7448";

    ctx.beginPath();

    ctx.moveTo(W * .47, h);
    ctx.lineTo(W * .53, h);
    ctx.lineTo(W * .94, H);
    ctx.lineTo(W * .06, H);

    ctx.closePath();
    ctx.fill();

    // Bordes del camino
    ctx.strokeStyle = "#d0a56a";
    ctx.lineWidth = 5;

    ctx.beginPath();
    ctx.moveTo(W * .47, h);
    ctx.lineTo(W * .06, H);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(W * .53, h);
    ctx.lineTo(W * .94, H);
    ctx.stroke();

    // Líneas de profundidad.
    for (let i = 0; i < 12; i++) {

        const z = ((i / 12) + runTime * speed * .25) % 1;

        const y = depthY(z);

        const width =
            W * (.02 + z * .35);

        ctx.strokeStyle = "rgba(255,255,255,.12)";
        ctx.lineWidth = Math.max(1, z * 4);

        ctx.beginPath();
        ctx.moveTo(W / 2 - width, y);
        ctx.lineTo(W / 2 + width, y);
        ctx.stroke();
    }
}

/* =========================
   VEGETACIÓN
========================= */

function drawTree(tree) {

    const z = tree.z;

    const y = depthY(z);

    const sideX =
        tree.side < 0
            ? W * (.08 - tree.offset * z)
            : W * (.92 + tree.offset * z);

    const scale =
        objectScale(z) * tree.size;

    ctx.save();

    ctx.translate(sideX, y);

    /* Tronco */

    ctx.fillStyle = "#58391e";

    ctx.fillRect(
        -12 * scale,
        -90 * scale,
        24 * scale,
        90 * scale
    );

    /* Hojas */

    ctx.fillStyle = "#174b24";

    ctx.beginPath();
    ctx.arc(
        0,
        -110 * scale,
        55 * scale,
        0,
        Math.PI * 2
    );
    ctx.fill();

    ctx.fillStyle = "#26733a";

    ctx.beginPath();
    ctx.arc(
        -30 * scale,
        -125 * scale,
        42 * scale,
        0,
        Math.PI * 2
    );
    ctx.fill();

    ctx.beginPath();
    ctx.arc(
        32 * scale,
        -120 * scale,
        45 * scale,
        0,
        Math.PI * 2
    );
    ctx.fill();

    ctx.restore();
}

/* =========================
   OBJETOS
========================= */

function drawCoin(obj) {

    if (obj.collected) return;

    const z = obj.z;

    const x = laneX(obj.lane, z);
    const y = depthY(z) - 45 * objectScale(z);

    const s = objectScale(z);

    ctx.save();

    ctx.translate(x, y);

    ctx.rotate(Math.sin(obj.rotation) * .25);

    ctx.scale(s, s);

    // Sombra
    ctx.fillStyle = "rgba(0,0,0,.2)";
    ctx.beginPath();
    ctx.ellipse(0, 28, 25, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    // Moneda
    ctx.fillStyle = "#ffd83d";
    ctx.beginPath();
    ctx.arc(0, 0, 25, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#b87800";
    ctx.lineWidth = 5;
    ctx.stroke();

    ctx.fillStyle = "#fff1a0";
    ctx.font = "bold 22px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("$", 0, 1);

    ctx.restore();
}

function drawObstacle(obj) {

    if (obj.hit) return;

    const z = obj.z;

    const x = laneX(obj.lane, z);
    const y = depthY(z);

    const s = objectScale(z);

    ctx.save();

    ctx.translate(x, y);
    ctx.scale(s, s);

    if (obj.type === "rock") {

        ctx.fillStyle = "#555b4f";

        ctx.beginPath();
        ctx.moveTo(-42, 10);
        ctx.lineTo(-30, -25);
        ctx.lineTo(0, -42);
        ctx.lineTo(35, -25);
        ctx.lineTo(45, 10);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#747b6b";

        ctx.beginPath();
        ctx.moveTo(-20, -22);
        ctx.lineTo(0, -38);
        ctx.lineTo(16, -20);
        ctx.closePath();
        ctx.fill();
    }

    if (obj.type === "log") {

        ctx.fillStyle = "#704321";

        ctx.rotate(-.08);

        ctx.fillRect(-55, -15, 110, 35);

        ctx.fillStyle = "#a86d3c";

        ctx.beginPath();
        ctx.arc(-55, 2, 18, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#3c2615";

        ctx.beginPath();
        ctx.arc(-55, 2, 10, 0, Math.PI * 2);
        ctx.fill();
    }

    if (obj.type === "branch") {

        ctx.strokeStyle = "#4c2c18";
        ctx.lineWidth = 20;
        ctx.lineCap = "round";

        ctx.beginPath();
        ctx.moveTo(-65, -80);
        ctx.lineTo(65, -80);
        ctx.stroke();

        ctx.lineWidth = 12;

        ctx.beginPath();
        ctx.moveTo(-25, -80);
        ctx.lineTo(-45, -125);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(25, -80);
        ctx.lineTo(50, -120);
        ctx.stroke();
    }

    ctx.restore();
}

/* =========================
   CAPIBARA
========================= */

function drawCapybara() {

    const x =
        laneX(lane, 1);

    const baseY =
        H * .84 - playerY * H * .24;

    /*
      Animación de carrera:
      cada pata alterna con la otra.
      runTime controla todo el ciclo.
    */

    const runCycle =
        Math.sin(runTime * 18);

    const legA =
        Math.sin(runTime * 18) * 14;

    const legB =
        Math.sin(runTime * 18 + Math.PI) * 14;

    // Rebote natural al correr.
    const bounce =
        Math.abs(Math.sin(runTime * 18)) * 4;

    ctx.save();

    ctx.translate(x, baseY - bounce);

    // Si está rodando, hacemos al capibara pequeño.
    if (rolling) {
        ctx.rotate(-.08);
        ctx.scale(1.18, .62);
    }

    // Sombra
    if (!jumping) {

        ctx.fillStyle = "rgba(0,0,0,.28)";

        ctx.beginPath();

        ctx.ellipse(
            0,
            54,
            70,
            15,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    /* Cola */

    ctx.strokeStyle = "#704a2c";
    ctx.lineWidth = 12;
    ctx.lineCap = "round";

    ctx.beginPath();
    ctx.moveTo(58, 0);
    ctx.quadraticCurveTo(83, -15, 82, 12);
    ctx.stroke();

    /* PATAS TRASERAS */

    ctx.strokeStyle = "#6b4528";
    ctx.lineWidth = 15;
    ctx.lineCap = "round";

    ctx.beginPath();
    ctx.moveTo(30, 30);
    ctx.lineTo(38 + legA, 62);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-25, 30);
    ctx.lineTo(-33 + legB, 62);
    ctx.stroke();

    /* Cuerpo */

    ctx.fillStyle = "#9a6740";

    ctx.beginPath();

    ctx.ellipse(
        0,
        0,
        65,
        42,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /* Barriga */

    ctx.fillStyle = "#b57b50";

    ctx.beginPath();

    ctx.ellipse(
        -5,
        12,
        43,
        27,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /* Cuello */

    ctx.fillStyle = "#9a6740";

    ctx.beginPath();

    ctx.ellipse(
        -45,
        -15,
        34,
        34,
        -.15,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /* Cabeza */

    ctx.fillStyle = "#9a6740";

    ctx.beginPath();

    ctx.ellipse(
        -67,
        -39,
        43,
        35,
        -.08,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /* Oreja */

    ctx.fillStyle = "#754b2d";

    ctx.beginPath();
    ctx.arc(-84, -68, 11, 0, Math.PI * 2);
    ctx.fill();

    /* Hocico */

    ctx.fillStyle = "#7a4c2d";

    ctx.beginPath();

    ctx.ellipse(
        -101,
        -34,
        20,
        15,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /* Nariz */

    ctx.fillStyle = "#241812";

    ctx.beginPath();
    ctx.ellipse(-110, -37, 7, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    /* Ojo */

    ctx.fillStyle = "#111";

    ctx.beginPath();
    ctx.arc(-79, -48, 5, 0, Math.PI * 2);
    ctx.fill();

    /* PATAS DELANTERAS */

    ctx.strokeStyle = "#754b2d";
    ctx.lineWidth = 13;

    ctx.beginPath();
    ctx.moveTo(-38, 20);
    ctx.lineTo(-45 + legB * .7, 58);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-8, 22);
    ctx.lineTo(2 + legA * .7, 58);
    ctx.stroke();

    /* Patitas */

    ctx.strokeStyle = "#51321f";
    ctx.lineWidth = 8;

    ctx.beginPath();
    ctx.moveTo(-45 + legB * .7, 58);
    ctx.lineTo(-53 + legB * .7, 62);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(2 + legA * .7, 58);
    ctx.lineTo(10 + legA * .7, 62);
    ctx.stroke();

    ctx.restore();
}

/* =========================
   COCODRILO
========================= */

function drawCrocodile() {

    const x =
        laneX(lane, 1) - W * .005;

    const y =
        H * .925;

    /*
      El cocodrilo tiene un ciclo
      diferente pero sincronizado con
      una carrera.
    */

    const cycle =
        Math.sin(runTime * 15);

    const leg1 =
        Math.sin(runTime * 15) * 13;

    const leg2 =
        Math.sin(runTime * 15 + Math.PI) * 13;

    ctx.save();

    ctx.translate(x, y);

    // Sombra
    ctx.fillStyle = "rgba(0,0,0,.35)";

    ctx.beginPath();
    ctx.ellipse(0, 45, 100, 16, 0, 0, Math.PI * 2);
    ctx.fill();

    /* Cola */

    ctx.strokeStyle = "#214d2c";
    ctx.lineWidth = 27;
    ctx.lineCap = "round";

    ctx.beginPath();

    ctx.moveTo(55, 12);
    ctx.quadraticCurveTo(
        110,
        25,
        150 + cycle * 8,
        0
    );

    ctx.stroke();

    /* Patas */

    ctx.strokeStyle = "#2d6135";
    ctx.lineWidth = 14;

    ctx.beginPath();
    ctx.moveTo(-30, 25);
    ctx.lineTo(-45 + leg1, 55);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(25, 25);
    ctx.lineTo(35 + leg2, 55);
    ctx.stroke();

    /* Cuerpo */

    ctx.fillStyle = "#306b3b";

    ctx.beginPath();

    ctx.ellipse(
        0,
        0,
        72,
        30,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /* Cabeza */

    ctx.fillStyle = "#397947";

    ctx.beginPath();

    ctx.ellipse(
        -68,
        -5,
        43,
        27,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /* Hocico */

    ctx.fillStyle = "#4b8b51";

    ctx.beginPath();

    ctx.ellipse(
        -105,
        0,
        40,
        14,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /* Ojo */

    ctx.fillStyle = "#e7c940";

    ctx.beginPath();
    ctx.arc(-77, -22, 8, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#111";

    ctx.beginPath();
    ctx.arc(-77, -22, 3, 0, Math.PI * 2);
    ctx.fill();

    /* Dientes */

    ctx.fillStyle = "#fff";

    for (let i = 0; i < 6; i++) {

        ctx.beginPath();

        ctx.moveTo(
            -125 + i * 11,
            9
        );

        ctx.lineTo(
            -120 + i * 11,
            22
        );

        ctx.lineTo(
            -114 + i * 11,
            9
        );

        ctx.closePath();

        ctx.fill();
    }

    ctx.restore();
}

/* =========================
   PARTÍCULAS / POLVO
========================= */

function drawDust() {

    if (!running) return;

    const amount = 8;

    for (let i = 0; i < amount; i++) {

        const x =
            W / 2 +
            rand(-W * .12, W * .12);

        const y =
            H * .91 +
            rand(-5, 18);

        const size =
            rand(1, 4);

        ctx.fillStyle =
            "rgba(235,220,180,.35)";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}

/* =========================
   DIBUJAR TODO
========================= */

function draw() {

    ctx.save();

    if (cameraShake > 0) {

        ctx.translate(
            rand(-2, 2),
            rand(-2, 2)
        );
    }

    drawSky();
    drawDistantJungle();
    drawPath();

    /*
      Primero árboles lejanos,
      luego objetos del camino.
    */

    const sortedTrees =
        [...jungleObjects]
        .sort((a, b) => a.z - b.z);

    for (const tree of sortedTrees) {
        drawTree(tree);
    }

    const sortedObjects =
        [...worldObjects]
        .sort((a, b) => a.z - b.z);

    for (const obj of sortedObjects) {

        if (obj.type === "coin")
            drawCoin(obj);
        else
            drawObstacle(obj);
    }

    drawDust();

    drawCrocodile();
    drawCapybara();

    ctx.restore();
}

/* =========================
   LOOP
========================= */

function loop(time) {

    let dt =
        (time - lastTime) / 1000;

    lastTime = time;

    // Evita saltos enormes si se bloquea la pestaña.
    dt = Math.min(dt, .05);

    update(dt);
    draw();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

</script>
